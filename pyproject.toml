[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sizespy"
version = "0.1.0"
description = "A Python package for analyzing and visualizing file sizes."
readme = "README.md"
requires-python = ">=3.8"

dependencies = [
    "colorama>=0.4.4",   
]

authors = [
    { name = "Kumaresan K P"}
]

[project.scripts]
sizespy = "sizespy.cli:run"

[project.urls]
"Homepage" = "https://github.com/kumaresan/sizespy"
"Bug Tracker" = "https://github.com/kumaresan/sizespy/issues"